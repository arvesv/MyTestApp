name: Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: string
      image_tag:
        description: 'Container image tag to deploy (e.g. latest, v0.1.1, short SHA)'
        required: false
        default: 'latest'
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'production'
        type: string
      image_tag:
        description: 'Container image tag to deploy'
        required: false
        default: 'latest'
        type: string
  workflow_run:
    workflows: ["Publish Container"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: ${{ inputs.environment != '' && inputs.environment || 'production' }}
      url: ${{ steps.cloud_run.outputs.url || steps.fly_io.outputs.url }}
    env:
      ENVIRONMENT_NAME: ${{ inputs.environment != '' && inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine Image
        id: image_info
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              TAG="${{ github.event.workflow_run.head_branch || 'master' }}"
            else
              TAG="latest"
            fi
          fi
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$REPO_LOWER:$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Selected container image: $IMAGE"

      # The target platform is selected by the GitHub Environment configuration:
      #   - GCP_CLOUD_RUN (variable or secret, any non-empty value) -> deploy to Google Cloud Run
      #   - FLY_IO        (variable or secret, any non-empty value) -> deploy to Fly.io
      # Both flags may be set to deploy the same image to both platforms.
      - name: Detect Deployment Target
        id: target
        env:
          GCP_CLOUD_RUN: ${{ vars.GCP_CLOUD_RUN || secrets.GCP_CLOUD_RUN }}
          FLY_IO: ${{ vars.FLY_IO || secrets.FLY_IO }}
        run: |
          TARGETS=()
          if [ -n "$GCP_CLOUD_RUN" ]; then
            echo "cloud_run=true" >> $GITHUB_OUTPUT
            TARGETS+=("Google Cloud Run")
          else
            echo "cloud_run=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$FLY_IO" ]; then
            echo "fly_io=true" >> $GITHUB_OUTPUT
            TARGETS+=("Fly.io")
          else
            echo "fly_io=false" >> $GITHUB_OUTPUT
          fi

          if [ ${#TARGETS[@]} -eq 0 ]; then
            MESSAGE="Environment '$ENVIRONMENT_NAME' does not define GCP_CLOUD_RUN or FLY_IO (as a variable or secret), so no deployment target could be determined."
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              echo "::warning::$MESSAGE Skipping automated deployment."
            else
              echo "::error::$MESSAGE Set one of them in the environment to select the deployment platform."
              exit 1
            fi
          else
            echo "Deployment target(s) for environment '$ENVIRONMENT_NAME': ${TARGETS[*]}"
          fi

      - name: Deploy to Google Cloud Run
        if: steps.target.outputs.cloud_run == 'true'
        id: cloud_run
        uses: ./.github/actions/deploy-cloud-run
        with:
          image: ${{ steps.image_info.outputs.image }}
          environment: ${{ env.ENVIRONMENT_NAME }}
          service: ${{ vars.GCP_SERVICE_NAME || 'mytestapp' }}
          region: ${{ vars.GCP_REGION || 'europe-north2' }}
          project-id: ${{ vars.GCP_PROJECT_ID || '' }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials-json: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS }}

      - name: Deploy to Fly.io
        if: steps.target.outputs.fly_io == 'true'
        id: fly_io
        uses: ./.github/actions/deploy-fly-io
        with:
          image: ${{ steps.image_info.outputs.image }}
          environment: ${{ env.ENVIRONMENT_NAME }}
          app: ${{ vars.FLY_APP_NAME || 'mytestapp' }}
          region: ${{ vars.FLY_REGION || '' }}
          api-token: ${{ secrets.FLY_API_TOKEN }}
