name: Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: string
      image_tag:
        description: 'Container image tag to deploy (e.g. latest, v0.1.1, short SHA)'
        required: false
        default: 'latest'
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'production'
        type: string
      image_tag:
        description: 'Container image tag to deploy'
        required: false
        default: 'latest'
        type: string
  workflow_run:
    workflows: ["Publish Container"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: ${{ inputs.environment != '' && inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine Image
        id: image_info
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$REPO_LOWER:$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Selected container image: $IMAGE"

      - name: Verify GCP Authentication Setup
        id: check_auth
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || \
             [ -n "${{ secrets.GCP_SA_KEY }}" ] || \
             [ -n "${{ secrets.GCP_CREDENTIALS }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              echo "::warning::GCP credentials (GCP_WORKLOAD_IDENTITY_PROVIDER or GCP_SA_KEY) are not configured in environment '${{ inputs.environment != '' && inputs.environment || 'production' }}' or repository secrets. Skipping automated deployment."
            else
              echo "::error::No GCP credentials found! Please configure either Workload Identity Federation (GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT) or a Service Account Key (GCP_SA_KEY) in the '${{ inputs.environment != '' && inputs.environment || 'production' }}' environment secrets or repository secrets."
              exit 1
            fi
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_auth.outputs.configured == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        if: steps.check_auth.outputs.configured == 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d  # v3.0.1
        with:
          service: ${{ vars.GCP_SERVICE_NAME || 'mytestapp' }}
          image: ${{ steps.image_info.outputs.image }}
          region: ${{ vars.GCP_REGION || 'europe-north2' }}
          project_id: ${{ vars.GCP_PROJECT_ID || '' }}
          flags: '--allow-unauthenticated'

      - name: Verify Deployment Health
        if: steps.check_auth.outputs.configured == 'true' && steps.deploy.outputs.url != ''
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Verifying health endpoint at: $SERVICE_URL/healthz"
          
          SUCCESS=false
          for i in {1..6}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/healthz" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check succeeded with HTTP 200 on attempt $i."
              SUCCESS=true
              break
            fi
            echo "Service not ready yet (attempt $i/6, HTTP $HTTP_STATUS). Retrying in 5 seconds..."
            sleep 5
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "::warning::Health check did not respond with 200 within timeout."
          else
            curl -sf "$SERVICE_URL/healthz" || true
            echo ""
          fi

      - name: Deployment Summary
        if: steps.check_auth.outputs.configured == 'true' && steps.deploy.outputs.url != ''
        run: |
          echo "### 🚀 Cloud Run Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ inputs.environment != '' && inputs.environment || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ vars.GCP_SERVICE_NAME || 'mytestapp' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ vars.GCP_REGION || 'europe-north2' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.image_info.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL**: [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
