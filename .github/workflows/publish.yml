name: Publish Container

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - name: Build and smoke test container
        uses: ./.github/actions/container-smoke-test
        with:
          image-tag: mytestapp:test

  publish:
    name: Build & Push to GHCR
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref }}

      - name: Get Git commit info
        id: git_info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          
          # Determine tag
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -z "$TAG" ] && [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Determine branch
          BRANCH=""
          if [ "${{ github.ref_type }}" = "branch" ]; then
            BRANCH="${{ github.ref_name }}"
          elif [ -n "$TAG" ]; then
            BRANCH="master"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Get build timestamp
        id: time
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=match,pattern=v(.*),group=1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=match,pattern=v(.*),group=1,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=semver,pattern={{major}},value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || inputs.tag_name != '' || github.event_name == 'release' }}
            type=sha,format=short,enable=${{ inputs.tag_name == '' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ steps.git_info.outputs.sha }}
            GIT_BRANCH=${{ steps.git_info.outputs.branch }}
            GIT_TAG=${{ steps.git_info.outputs.tag }}
            BUILD_TIME=${{ steps.time.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
