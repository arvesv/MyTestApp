name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MyTestApp.sln

      - name: Build solution (Release)
        run: dotnet build MyTestApp.sln --configuration Release --no-restore

  container-build-and-test:
    name: Container Build & Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build Docker image
        run: |
          docker build -t mytestapp:${{ github.sha }} -t mytestapp:latest .

      - name: Start container for smoke test
        run: |
          docker run -d --name smoke-test -p 8080:8080 mytestapp:${{ github.sha }}
          # Wait for application startup
          for i in {1..15}; do
            if curl -s http://localhost:8080/healthz | grep -q "Healthy"; then
              echo "Container is healthy!"
              exit 0
            fi
            echo "Waiting for container..."
            sleep 1
          done
          echo "Container failed to become healthy within timeout"
          docker logs smoke-test
          exit 1

      - name: Verify JSON and HTML endpoints
        run: |
          echo "Verifying /api/info endpoint:"
          curl -f -s http://localhost:8080/api/info | jq .

          echo "Verifying / endpoint:"
          curl -f -s http://localhost:8080/ | grep -q "System Diagnostics"

      - name: Cleanup smoke test container
        if: always()
        run: |
          docker rm -f smoke-test || true

