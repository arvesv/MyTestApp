name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MyTestApp.sln

      - name: Build solution (Release)
        run: dotnet build MyTestApp.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test MyTestApp.sln --configuration Release --no-build --verbosity normal

  container-build-and-test:
    name: Container Build & Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build and smoke test container
        uses: ./.github/actions/container-smoke-test
        with:
          image-tag: mytestapp:${{ github.sha }}
