name: Container smoke test
description: Build a container image and verify its health, JSON, and HTML endpoints
inputs:
  image-tag:
    description: Tag to apply to the image built for the smoke test
    required: true
runs:
  using: composite
  steps:
    - name: Build container image
      shell: bash
      run: |
        GIT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
        GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
        BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "")
        docker build \
          --build-arg GIT_COMMIT_SHA="$GIT_SHA" \
          --build-arg GIT_BRANCH="$GIT_BRANCH" \
          --build-arg BUILD_TIME="$BUILD_TIME" \
          -t "${{ inputs.image-tag }}" .

    - name: Run container smoke test
      shell: bash
      run: |
        docker run -d --name smoke-test -p 8080:8080 "${{ inputs.image-tag }}"
        for i in {1..15}; do
          if curl -s http://localhost:8080/healthz | grep -q "Healthy"; then
            echo "Container is healthy!"
            exit 0
          fi
          echo "Waiting for container to become healthy..."
          sleep 1
        done
        echo "Container failed to become healthy within timeout"
        docker logs smoke-test
        exit 1

    - name: Verify JSON and HTML endpoints
      shell: bash
      run: |
        curl -f -s http://localhost:8080/api/info | jq -e '.operatingSystem' > /dev/null
        curl -f -s http://localhost:8080/api/info | jq -e '.gitCommitSha' > /dev/null
        curl -f -s http://localhost:8080/ | grep -q "System Diagnostics"
        curl -f -s http://localhost:8080/ | grep -q "Build &amp; Version"

    - name: Cleanup smoke test container
      if: always()
      shell: bash
      run: docker rm -f smoke-test || true
